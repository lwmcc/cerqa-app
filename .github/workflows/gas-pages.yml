# Rebuilds the Mexico gas price pages every night from the CNE feeds and commits them,
# which deploys cerqa.app through Amplify. CNE publishes around 18:00 Mexico City time.
name: Gas price pages

on:
  schedule:
    - cron: "30 1 * * *"   # 19:30 Mexico City
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages
        run: python3 scripts/build_gas_pages.py
      - name: Commit if prices changed
        run: |
          git config user.name "cerqa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add es/gasolina gas-prices-mexico sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Gas prices: $(TZ=America/Mexico_City date +%F)"
            git push
          fi
